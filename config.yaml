seed: 42

data:
  splits_file: data/splits.csv
  candidates_file: data/processed/candidate_features.csv
  raw_root: ../PathSnap-Dataset/Student folder
  private_dir: ../pathsnap-private
  crs: EPSG:32640  # UTM zone 40N; local to GPS points around 55E, 56N

matching:
  candidate_radius_m: 200  # Replaced by the training-only radius experiment selection.
  radius_experiments_m: [150, 175, 200]
  max_candidates: 30
  radius_selection_model: random_forest
  selection_f1_tolerance: 0.002

features:
  - distance_m
  - bearing_diff_deg
  - speed_mps
  - time_gap_s
  - segment_length_m
  - n_candidates
  - dist_rank
  - dist_gap_m

modelling:
  cv_folds: 5
  neg_per_obs: 10
  models:
    - logreg
    - naive_bayes
    - decision_tree
    - random_forest
    - hist_gradient_boosting

tuning:
  n_trials: 12
  cv_folds: 5
  objective: training_groupkfold_macro_f1
  selected_model: auto
  timeout_seconds: 0

hmm:
  selected_classifier: auto
  probability_floor: 1.0e-12
  transition:
    distance_scale_m: 100.0
    max_network_distance_m: 5000.0
    max_speed_mps: 70.0

api:
  host: 0.0.0.0
  port: 8000
